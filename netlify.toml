[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."grade-exam"]
  # Ønsket tidsgrænse for AI-retning. Hvor lang tid en synkron funktion
  # faktisk må køre, afhænger af jeres Netlify-plan – tjek det i Netlify,
  # og sæt OPENAI_TIMEOUT_MS lidt under grænsen.
  timeout = 60

# Sikkerheds-headers til hele sitet
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
